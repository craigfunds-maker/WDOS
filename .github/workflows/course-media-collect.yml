# Brings the results of a finished "Course media" run into the branch: narration for every language, and the
# Hausa, Yoruba and Igbo course text and screen texts. Start it by hand with the run number of the media run.
name: Course media collect
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Course media run id', required: true }
permissions: { contents: write, actions: read }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}', path: art }
      - name: Place the files
        run: |
          set -e; ls art
          for d in art/voice-*; do [ -d "$d" ] || continue; L=${d#art/voice-}; rm -rf wdos-php/assets/courses/voice/$L; mkdir -p wdos-php/assets/courses/voice/$L; cp -a $d/. wdos-php/assets/courses/voice/$L/; done
          for d in art/mt-*; do [ -d "$d" ] || continue; L=${d#art/mt-}; S=$d/$L; [ -d "$S" ] || S=$d
            mkdir -p wdos-php/assets/courses/$L; cp $S/wgmn.json $S/wnnn.json wdos-php/assets/courses/$L/ 2>/dev/null || true
            if [ -f $S/i18n.json ]; then cp $S/i18n.json wdos-php/assets/i18n/$L.json; fi; done
          git config user.name "WDOS course media"; git config user.email "noreply@anthropic.com"
          git add -A wdos-php/assets && git commit -m "Course media from run ${{ inputs.run_id }}: narration and Hausa, Yoruba, Igbo texts" && git push || echo "nothing new"
