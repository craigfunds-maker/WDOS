# GeoNames (CC BY 4.0): populated places (towns, villages, neighbourhoods) and second-level admin areas for every
# country, filtered to the columns WDOS needs, kept on branch geo-names. Start it by changing tools/geo/geonames.json.
name: Geo GeoNames fetch
on:
  push:
    paths: ['tools/geo/geonames.json']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download and filter
        run: |
          set -e; mkdir out; cd out
          curl -sSL --retry 3 -o all.zip https://download.geonames.org/export/dump/allCountries.zip
          curl -sSL --retry 3 -o admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
          curl -sSL --retry 3 -o admin2Codes.txt https://download.geonames.org/export/dump/admin2Codes.txt
          unzip -q all.zip allCountries.txt && rm all.zip
          # name, lat, lon, feature code, country, admin1, admin2, admin3, population
          awk -F'\t' 'BEGIN{OFS="\t"} ($7=="P" && $8!~/^(PPLH|PPLQ|PPLW|PPLCH)$/) || ($7=="A" && $8~/^ADM[234]$/) {print $2,$5,$6,$8,$9,$11,$12,$13,$15}' allCountries.txt > places.tsv
          rm allCountries.txt; wc -l places.tsv
          gzip -9 places.tsv; ls -la
          find . -type f -size +95M | while read f; do split -b 90M -d "$f" "$f.part-"; rm "$f"; done
          git init -q && git checkout -q -b geo-names && git add -A
          git -c user.name="WDOS geo" -c user.email="noreply@anthropic.com" commit -qm "GeoNames places and admin areas $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" geo-names
