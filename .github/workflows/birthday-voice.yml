# Speaks each member's birthday greeting from WODDI HQ, with her name, in her own language, and sends it to WDOS (v109.44).
# Kokoro (af_heart, ff_siwis, pf_dora) for English, French and Portuguese; Piper for Swahili and Arabic; the VITS Open Bible
# voices for Hausa, Yoruba and Igbo. Only the voices needed today are installed. Runs four times a day for birthdays from today
# to three days ahead. GitHub's signed OIDC token proves the job to WDOS, so there is no password or key to keep.
# WDOS only accepts this file, on the main branch of craigfunds-maker/WDOS.
name: Birthday voice
on:
  schedule: [{ cron: '17 0,6,12,18 * * *' }]
  workflow_dispatch:
permissions: { id-token: write, contents: read }
concurrency: { group: birthday-voice, cancel-in-progress: false }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Which birthdays
        run: python tools/birthday/voice.py list
      - name: Voices needed today
        run: |
          [ -s /tmp/bday_engines ] || exit 0
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg espeak-ng >/dev/null
          pip install -q numpy soundfile; mkdir -p /tmp/m
          if grep -qx kokoro /tmp/bday_engines; then pip install -q kokoro-onnx
            curl -sSL -o /tmp/m/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSL -o /tmp/m/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin; fi
          if grep -qx piper /tmp/bday_engines; then pip install -q piper-tts
            for v in vits-piper-sw_CD-lanfrica-medium vits-piper-ar_JO-kareem-medium; do curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$v.tar.bz2 | tar xj -C /tmp/m; done; fi
          if grep -qx vits /tmp/bday_engines; then pip install -q 'torch<2.9' 'torchaudio<2.9' --index-url https://download.pytorch.org/whl/cpu
            pip install -q coqui-tts huggingface_hub six 'torch<2.9' 'torchaudio<2.9' --extra-index-url https://download.pytorch.org/whl/cpu; fi
      - name: Speak and send
        run: '[ -s /tmp/bday_engines ] && python tools/birthday/voice.py speak /tmp/m || echo "no birthdays waiting"'
